<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Inselkarte Lindau</title>
<style>html,body{margin:0}</style>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: Vollbild-Punktwolke, oben eine schmale Lageleiste, unten eine Werkzeugleiste für den Daumen. Bewusst nur dunkel: Punkte leuchten auf Seegrund. */
:root {
  --see: #0b1519;          /* Hintergrund: Bodensee bei Nacht */
  --tafel: rgba(14, 26, 31, 0.86);
  --linie: #24404a;
  --text: #dfe8e6;
  --leise: #8aa3a2;
  --akzent: #7fc8c0;       /* Wasserlinie */
  --warm: #e0a458;         /* Fahrtspur */
  --display: "Archivo", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Consolas", monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--see); color: var(--text); font-family: var(--display); overflow: hidden; }
#bild { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
.leiste {
  position: fixed; left: 0; right: 0; z-index: 5;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
  pointer-events: none;
}
.leiste > * { pointer-events: auto; }
#oben { top: 0; padding-top: calc(10px + env(safe-area-inset-top, 0px)); justify-content: space-between; }
#unten { bottom: 0; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); justify-content: center; }
.marke { display: flex; flex-direction: column; gap: 2px; background: var(--tafel); border: 1px solid var(--linie); border-radius: 10px; padding: 8px 12px; backdrop-filter: blur(6px); min-width: 0; }
.marke h1 { margin: 0; font-size: 17px; font-weight: 700; letter-spacing: 0.01em; }
.marke .zeile { font-family: var(--mono); font-size: 11.5px; color: var(--leise); font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#kompass { width: 46px; height: 46px; border-radius: 50%; background: var(--tafel); border: 1px solid var(--linie); display: grid; place-items: center; cursor: pointer; flex: none; }
#kompass svg { width: 34px; height: 34px; transition: transform 0.08s linear; }
.werkzeug { display: flex; gap: 6px; flex-wrap: wrap; justify-content: center; background: var(--tafel); border: 1px solid var(--linie); border-radius: 14px; padding: 6px; backdrop-filter: blur(6px); max-width: 100%; }
button { font: 500 13px var(--display); color: var(--text); background: transparent; border: 1px solid var(--linie); border-radius: 9px; padding: 8px 11px; cursor: pointer; min-height: 38px; }
button[aria-pressed="true"] { background: var(--akzent); color: var(--see); border-color: var(--akzent); }
button:focus-visible { outline: 2px solid var(--akzent); outline-offset: 2px; }
.gruppe { display: flex; gap: 4px; align-items: center; }
.gruppe span { font-size: 11px; color: var(--leise); text-transform: uppercase; letter-spacing: 0.08em; padding: 0 4px; }
#laden { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 6; text-align: center; font-family: var(--mono); font-size: 13px; color: var(--leise); background: var(--tafel); border: 1px solid var(--linie); border-radius: 12px; padding: 14px 18px; }
#laden .balken { width: 220px; max-width: 70vw; height: 4px; background: var(--linie); border-radius: 2px; margin-top: 10px; overflow: hidden; }
#laden .balken i { display: block; height: 100%; width: 0; background: var(--akzent); transition: width 0.3s; }
#quelle { position: fixed; z-index: 4; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); font-size: 13.5px; color: var(--text); max-width: min(80vw, 520px); text-align: right; line-height: 1.45; pointer-events: none; background: var(--tafel); border: 1px solid var(--linie); border-radius: 10px; padding: 7px 11px; backdrop-filter: blur(6px); }
#quelle strong { font-size: 14.5px; color: #ffffff; }
/* Lineal: zwei Messpunkte, Strecke als Overlay */
body.messen #bild { cursor: crosshair; }
.messpunkt { position: fixed; z-index: 4; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: #ffd166; border: 2px solid var(--see); box-shadow: 0 0 0 1px #ffd166; pointer-events: none; }
.messpunkt b { position: absolute; left: 13px; top: -15px; font: 700 11px var(--mono); color: #ffd166; text-shadow: 0 0 3px #000; }
#messMitte { position: fixed; z-index: 4; transform: translate(-50%, -130%); font: 500 13px var(--mono); color: var(--see); background: #ffd166; border-radius: 7px; padding: 3px 8px; pointer-events: none; white-space: nowrap; font-variant-numeric: tabular-nums; }
#messTafel { position: fixed; z-index: 5; left: 50%; transform: translateX(-50%); top: calc(84px + env(safe-area-inset-top, 0px)); background: var(--tafel); border: 1px solid #ffd166; border-radius: 10px; padding: 8px 10px 8px 14px; display: flex; gap: 12px; align-items: center; max-width: calc(100vw - 32px); backdrop-filter: blur(6px); }
#messTafel .wert { font: 700 18px var(--display); color: #ffd166; font-variant-numeric: tabular-nums; }
#messTafel .zeile { font: 400 11.5px var(--mono); color: var(--leise); font-variant-numeric: tabular-nums; }
#messTafel button { min-height: 32px; padding: 4px 10px; }
[hidden] { display: none !important; }
@media (max-width: 520px) { button { padding: 7px 9px; font-size: 12.5px; } .gruppe span { display: none; } #quelle { bottom: calc(130px + env(safe-area-inset-bottom, 0px)); font-size: 12.5px; } }
@media (prefers-reduced-motion: reduce) { #kompass svg, #laden .balken i { transition: none; } }
</style>
</head>
<body>


<canvas id="bild" aria-label="3D-Punktwolke der Insel Lindau"></canvas>

<div class="leiste" id="oben">
  <div class="marke">
    <h1>Inselkarte Lindau</h1>
    <div class="zeile" id="lage">ETRS89 / UTM 32 · Daten werden geladen</div>
  </div>
  <div id="kompass" role="button" tabindex="0" aria-label="Nach Norden ausrichten" title="Nach Norden ausrichten">
    <svg viewBox="0 0 40 40" aria-hidden="true"><polygon points="20,4 25,20 20,17 15,20" fill="#e0a458"/><polygon points="20,36 25,20 20,23 15,20" fill="#8aa3a2"/><text x="20" y="13.5" text-anchor="middle" font-size="7" font-family="Archivo, sans-serif" font-weight="700" fill="#0b1519">N</text></svg>
  </div>
</div>

<div id="laden">Lade Punktwolke …<div id="ladeText">Stufe wird gewählt …</div><div class="balken"><i id="ladeBalken"></i></div></div>

<div id="quelle"><strong>©Silas Maile - M.Sc. Mathematik</strong><br>Dächer, Höfe, Bäume von Bayerischer Vermessungsverwaltung (CC BY 4.0)</div>

<div class="leiste" id="unten">
  <div class="werkzeug" role="toolbar" aria-label="Darstellung">
    <div class="gruppe" role="group" aria-label="Farbe">
      <span>Farbe</span>
      <button id="fFoto" aria-pressed="true">Foto</button>
      <button id="fHoehe" aria-pressed="false">Höhe</button>
      <button id="fQuelle" aria-pressed="false">Quelle</button>
    </div>
    <div class="gruppe" role="group" aria-label="Ebenen">
      <button id="tLuft" aria-pressed="true">Dächer</button>
      <button id="tSpur" aria-pressed="true">Fahrt</button>
    </div>
    <div class="gruppe" role="group" aria-label="Punktgröße">
      <span>Punkte</span>
      <button id="kleiner" aria-label="Punkte kleiner">−</button>
      <button id="groesser" aria-label="Punkte größer">+</button>
    </div>
    <div class="gruppe" role="group" aria-label="Detailstufe" id="stufen" hidden>
      <span>Stufe</span>
    </div>
    <div class="gruppe" role="group" aria-label="Ansicht">
      <button id="vOben">Von oben</button>
      <button id="vSchraeg">Schräg</button>
    </div>
    <div class="gruppe" role="group" aria-label="Messen">
      <button id="tLineal" aria-pressed="false" title="Abstand messen: zwei Punkte anklicken (Esc beendet)">Lineal</button>
    </div>
  </div>
</div>

<div id="messTafel" hidden aria-live="polite">
  <div><div class="wert" id="messWert">Ersten Punkt anklicken</div><div class="zeile" id="messZeile">Klick auf die Punktwolke setzt Punkt A</div></div>
  <button id="messZu" aria-label="Lineal beenden">✕</button>
</div>
<div class="messpunkt" id="messA" hidden><b>A</b></div>
<div class="messpunkt" id="messB" hidden><b>B</b></div>
<div id="messMitte" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const canvas = $("bild");
  const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: "high-performance" });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0b1519);
  const camera = new THREE.PerspectiveCamera(55, 1, 0.5, 6000);
  const controls = new THREE.OrbitControls(camera, canvas);
  controls.enableDamping = true;
  controls.dampingFactor = 0.12;
  controls.screenSpacePanning = false;
  controls.maxPolarAngle = Math.PI * 0.495;
  controls.minDistance = 2;
  controls.maxDistance = 3500;
  controls.touches = { ONE: THREE.TOUCH.ROTATE, TWO: THREE.TOUCH.DOLLY_PAN };

  const state = { farbe: "foto", groesse: 1.0, luft: true, spur: true, meta: null, zLo: 394, zHi: 428 };
  let spur = null, geladen = 0;

  // Punkte direkt aus den Binärteilen: int16 x,y,z | uint8 r,g,b | uint8 info (10 Byte) – keine Kopie im
  // Speicher, Farbe/Höhe/Quelle und das Ausblenden der Befliegung macht der Shader (50 Mio. Punkte möglich)
  const uni = {
    massstab: { value: 0.025 }, groesse: { value: 0.9 }, skala: { value: 1 }, hell: { value: 1.45 },
    zLo: { value: 394 }, zHi: { value: 428 }, mitteZ: { value: 0 }, luftAn: { value: 1 }, modus: { value: 0 },
  };
  const material = new THREE.ShaderMaterial({
    uniforms: uni,
    vertexShader: `
      attribute vec3 farbe; attribute float info;
      uniform float massstab, groesse, skala, hell, zLo, zHi, mitteZ, luftAn, modus;
      varying vec3 vc;
      vec3 hoehe(float t) {
        vec3 c0 = vec3(0.18, 0.36, 0.42), c1 = vec3(0.42, 0.62, 0.55), c2 = vec3(0.86, 0.80, 0.58),
             c3 = vec3(0.88, 0.55, 0.33), c4 = vec3(0.95, 0.93, 0.90);
        if (t < 0.25) return mix(c0, c1, t / 0.25);
        if (t < 0.5) return mix(c1, c2, (t - 0.25) / 0.25);
        if (t < 0.75) return mix(c2, c3, (t - 0.5) / 0.25);
        return mix(c3, c4, (t - 0.75) / 0.25);
      }
      void main() {
        float luft = floor(info / 16.0 + 0.01) > 1.5 ? 1.0 : 0.0;     // Quelle 2/3 = Befliegung/LoD2
        vc = vec3(0.0);
        if (luft > 0.5 && luftAn < 0.5) { gl_Position = vec4(0.0, 0.0, 2.0, 1.0); gl_PointSize = 0.0; return; }
        vec3 p = vec3(position.x, position.z, -position.y) * massstab;  // Ost, Höhe, −Nord
        vec4 mv = modelViewMatrix * vec4(p, 1.0);
        gl_Position = projectionMatrix * mv;
        gl_PointSize = clamp(groesse * (luft > 0.5 ? 1.2 : 1.0) * skala / max(-mv.z, 0.1), 1.0, 32.0);
        if (modus < 0.5) vc = pow(farbe, vec3(1.0 / hell));             // Kamerafarben sanft aufhellen
        else if (modus < 1.5) vc = hoehe(clamp(((modelMatrix * vec4(p, 1.0)).y + mitteZ - zLo) / (zHi - zLo), 0.0, 1.0));
        else vc = luft > 0.5 ? vec3(0.88, 0.64, 0.35) : vec3(0.50, 0.78, 0.75);
      }`,
    fragmentShader: `
      varying vec3 vc;
      void main() {
        vec2 q = gl_PointCoord * 2.0 - 1.0;
        if (dot(q, q) > 1.0) discard;                                    // runde Punkte
        gl_FragColor = vec4(vc, 1.0);
      }`,
  });

  function resize() {
    const w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    uni.skala.value = renderer.getDrawingBufferSize(new THREE.Vector2()).y / (2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)));
  }
  window.addEventListener("resize", resize);
  resize();

  function teilAufbauen(buf, versatz) {
    const n = buf.byteLength / 10;
    const ib16 = new THREE.InterleavedBuffer(new Int16Array(buf), 5);
    const ib8 = new THREE.InterleavedBuffer(new Uint8Array(buf), 10);
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.InterleavedBufferAttribute(ib16, 3, 0, false));
    g.setAttribute("farbe", new THREE.InterleavedBufferAttribute(ib8, 3, 6, true));
    g.setAttribute("info", new THREE.InterleavedBufferAttribute(ib8, 1, 9, false));
    const pts = new THREE.Points(g, material);
    pts.frustumCulled = false;
    if (versatz) pts.position.set(versatz[0], versatz[2], -versatz[1]);   // Block-Versatz (Ost, Höhe, −Nord)
    scene.add(pts);
    return { n, i16: ib16.array, u8: ib8.array };
  }

  // ---------------------------------------------------------------- Lineal
  // Auswahl auf der CPU direkt in den Binärteilen: alle Punkte im Sichtkegel (wenige Pixel um den Klick),
  // davon die vorderste Fläche, dort der Punkt am nächsten zum Strahl. Welt = (x·s+vO, z·s+vH, −(y·s+vN)).
  const teileDaten = [];
  const mess = { an: false, p: [], linie: null };
  function punktWaehlen(cx, cy) {
    const m = state.meta; if (!m || !teileDaten.length) return null;
    const r = canvas.getBoundingClientRect();
    const ndc = new THREE.Vector2(((cx - r.left) / r.width) * 2 - 1, -((cy - r.top) / r.height) * 2 + 1);
    const rc = new THREE.Raycaster(); rc.setFromCamera(ndc, camera);
    const o = rc.ray.origin, d = rc.ray.direction, s = m.massstab_m;
    const tol = (mobil ? 14 : 7) * 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) / r.height;
    const k2 = tol * tol, ohneLuft = !state.luft;
    const lauf = (fn) => {
      for (let pi = 0; pi < teileDaten.length; pi++) {
        const T = teileDaten[pi], a = T.i16, u = T.u8;
        const ox = o.x - T.v[0], oy = o.y - T.v[2], oz = o.z + T.v[1];
        for (let j = 0, b = 9; j < a.length; j += 5, b += 10) {
          if (ohneLuft && u[b] >= 32) continue;                       // Befliegung/LoD2 ausgeblendet
          const px = a[j] * s - ox, py = a[j + 2] * s - oy, pz = -a[j + 1] * s - oz;
          const t = px * d.x + py * d.y + pz * d.z;
          if (t < 0.3) continue;
          const q = px * px + py * py + pz * pz - t * t;
          if (q < k2 * t * t) fn(t, q / (t * t), pi, j);
        }
      }
    };
    let tMin = Infinity;
    lauf((t) => { if (t < tMin) tMin = t; });
    if (!isFinite(tMin)) return null;
    const tMax = tMin + Math.max(0.4, tMin * 0.004);                  // nur die vorderste Fläche
    let best = Infinity, bp = -1, bj = -1;
    lauf((t, w, pi, j) => { if (t <= tMax && w < best) { best = w; bp = pi; bj = j; } });
    const T = teileDaten[bp], a = T.i16;
    return new THREE.Vector3(a[bj] * s + T.v[0], a[bj + 2] * s + T.v[2], -(a[bj + 1] * s + T.v[1]));
  }
  const zahl = (v, n = 2) => v.toLocaleString("de-DE", { minimumFractionDigits: n, maximumFractionDigits: n });
  function messAnzeigen() {
    const [A, B] = mess.p;
    $("messA").hidden = !A; $("messB").hidden = !B; $("messMitte").hidden = !B;
    if (mess.linie) { scene.remove(mess.linie); mess.linie.geometry.dispose(); mess.linie = null; }
    const hz = (p) => zahl(p.y + state.meta.mitte[2], 1);
    if (!A) { $("messWert").textContent = "Ersten Punkt anklicken"; $("messZeile").textContent = "Klick auf die Punktwolke setzt Punkt A"; return; }
    if (!B) { $("messWert").textContent = "Zweiten Punkt anklicken"; $("messZeile").textContent = `A: Höhe ${hz(A)} m ü. NHN`; return; }
    const g = new THREE.BufferGeometry().setFromPoints([A, B]);
    mess.linie = new THREE.Line(g, new THREE.LineBasicMaterial({ color: 0xffd166, depthTest: false, depthWrite: false, transparent: true }));
    mess.linie.renderOrder = 1000;
    scene.add(mess.linie);
    const dx = B.x - A.x, dy = B.y - A.y, dz = B.z - A.z;
    const d3 = Math.hypot(dx, dy, dz), dh = Math.hypot(dx, dz);
    $("messWert").textContent = `${zahl(d3)} m`;
    $("messMitte").textContent = `${zahl(d3)} m`;
    $("messZeile").textContent = `waagrecht ${zahl(dh)} m · Höhenunterschied ${dy >= 0 ? "+" : "−"}${zahl(Math.abs(dy))} m · A ${hz(A)} / B ${hz(B)} m ü. NHN`;
  }
  const _v = new THREE.Vector3();
  function aufBildschirm(el, p) {
    _v.copy(p).project(camera);
    const sicht = _v.z < 1 && Math.abs(_v.x) < 1.2 && Math.abs(_v.y) < 1.2;
    el.style.visibility = sicht ? "visible" : "hidden";
    el.style.left = `${((_v.x + 1) / 2) * window.innerWidth}px`;
    el.style.top = `${((1 - _v.y) / 2) * window.innerHeight}px`;
  }
  function messNachfuehren() {
    if (!mess.an) return;
    const [A, B] = mess.p;
    if (A) aufBildschirm($("messA"), A);
    if (B) { aufBildschirm($("messB"), B); aufBildschirm($("messMitte"), A.clone().add(B).multiplyScalar(0.5)); }
  }
  function linealSetzen(an) {
    mess.an = an; mess.p = [];
    document.body.classList.toggle("messen", an);
    $("tLineal").setAttribute("aria-pressed", String(an));
    $("messTafel").hidden = !an;
    messAnzeigen();
  }
  let unten = null;                                                  // Klick ≠ Drehen/Schieben
  canvas.addEventListener("pointerdown", (e) => { unten = { x: e.clientX, y: e.clientY, t: performance.now() }; });
  canvas.addEventListener("pointerup", (e) => {
    if (!mess.an || !unten || !e.isPrimary) return;
    const weit = Math.hypot(e.clientX - unten.x, e.clientY - unten.y), lang = performance.now() - unten.t;
    unten = null;
    if (weit > 6 || lang > 600) return;
    $("messZeile").textContent = "suche Punkt …";
    setTimeout(() => {
      const p = punktWaehlen(e.clientX, e.clientY);
      if (!p) { messAnzeigen(); $("messZeile").textContent = "Kein Punkt getroffen – näher heranzoomen oder genauer klicken"; return; }
      if (mess.p.length >= 2) mess.p = [];
      mess.p.push(p);
      messAnzeigen();
    }, 0);
  });

  function spurAufbauen(fahrt) {
    if (!fahrt || !fahrt.length) return;
    const pos = new Float32Array(fahrt.length * 3), col = new Float32Array(fahrt.length * 3), tMax = fahrt[fahrt.length - 1][3] || 1;
    fahrt.forEach((p, i) => {
      pos[i * 3] = p[0]; pos[i * 3 + 1] = p[2] + 1.2; pos[i * 3 + 2] = -p[1];
      const f = p[3] / tMax;
      col[i * 3] = 0.98 - 0.10 * f; col[i * 3 + 1] = 0.82 - 0.38 * f; col[i * 3 + 2] = 0.52 - 0.36 * f;
    });
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.BufferAttribute(col, 3));
    // zuletzt und ohne Tiefentest zeichnen → die Fahrspur liegt immer sichtbar über den Punkten
    spur = new THREE.Line(g, new THREE.LineBasicMaterial({ vertexColors: true, transparent: true, opacity: 0.95,
                                                           depthTest: false, depthWrite: false }));
    spur.renderOrder = 999;
    spur.visible = state.spur;
    scene.add(spur);
  }

  function ansicht(art) {
    const m = state.meta; if (!m) return;
    const ex = Math.max(m.bbox_max[0] - m.bbox_min[0], m.bbox_max[1] - m.bbox_min[1]);
    const ziel = new THREE.Vector3(0, state.zLo - m.mitte[2] + 6, 0);
    controls.target.copy(ziel);
    if (art === "oben") camera.position.set(0, ziel.y + ex * 0.95, 0.01);
    else camera.position.set(ex * 0.18, ziel.y + ex * 0.42, ex * 0.55);
    camera.up.set(0, 1, 0);
    controls.update();
  }

  const fmt = (v) => Math.round(v).toLocaleString("de-DE");
  const mio = (v) => (v / 1e6).toLocaleString("de-DE", { maximumFractionDigits: 1 });
  let stufeText = "";
  function lageAnzeigen() {
    const m = state.meta; if (!m) return;
    const t = controls.target;
    $("lage").textContent = `E ${fmt(m.mitte[0] + t.x)} · N ${fmt(m.mitte[1] - t.z)} · ${fmt(camera.position.distanceTo(t))} m Abstand${stufeText}`;
    const az = Math.atan2(camera.position.x - t.x, camera.position.z - t.z);
    $("kompass").querySelector("svg").style.transform = `rotate(${(az * 180 / Math.PI).toFixed(1)}deg)`;
  }

  function knopf(id, fn) { $(id).addEventListener("click", fn); }
  function farbeSetzen(f) {
    state.farbe = f;
    uni.modus.value = { foto: 0, hoehe: 1, quelle: 2 }[f];
    [["fFoto", "foto"], ["fHoehe", "hoehe"], ["fQuelle", "quelle"]].forEach(([id, v]) => $(id).setAttribute("aria-pressed", String(v === f)));
  }
  knopf("fFoto", () => farbeSetzen("foto"));
  knopf("fHoehe", () => farbeSetzen("hoehe"));
  knopf("fQuelle", () => farbeSetzen("quelle"));
  knopf("tLuft", () => { state.luft = !state.luft; uni.luftAn.value = state.luft ? 1 : 0; $("tLuft").setAttribute("aria-pressed", String(state.luft)); });
  knopf("tSpur", () => { state.spur = !state.spur; $("tSpur").setAttribute("aria-pressed", String(state.spur)); if (spur) spur.visible = state.spur; });
  let basisGroesse = 0.9;
  const groesse = (f) => { state.groesse = Math.min(6, Math.max(0.2, state.groesse * f)); uni.groesse.value = basisGroesse * state.groesse; };
  knopf("kleiner", () => groesse(1 / 1.3));
  knopf("groesser", () => groesse(1.3));
  knopf("vOben", () => ansicht("oben"));
  knopf("vSchraeg", () => ansicht("schraeg"));
  const nord = () => {
    const t = controls.target, d = camera.position.clone().sub(t);
    const r = Math.hypot(d.x, d.z);
    camera.position.set(t.x, camera.position.y, t.z + Math.max(r, 0.01));
    controls.update();
  };
  knopf("tLineal", () => linealSetzen(!mess.an));
  knopf("messZu", () => linealSetzen(false));
  window.addEventListener("keydown", (e) => { if (e.key === "Escape" && mess.an) linealSetzen(false); });
  $("kompass").addEventListener("click", nord);
  $("kompass").addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); nord(); } });

  function schleife() {
    controls.update();
    lageAnzeigen();
    messNachfuehren();
    renderer.render(scene, camera);
    requestAnimationFrame(schleife);
  }

  // Detailstufe: ?stufe=NAME, sonst nach Gerät (Handy/Tablet → kleinste, sonst größte Stufe)
  const mobil = /Android|iPhone|iPad|iPod|Mobile|Silk|Kindle|Opera Mini/i.test(navigator.userAgent)
             || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
  async function stufeWaehlen() {
    let liste = [];
    try {
      const r = await fetch("versionen.json");
      if (r.ok) liste = (await r.json()).versionen || [];
    } catch (e) { /* einstufiges Paket */ }
    if (!liste.length) return "";
    liste.sort((a, b) => b.punkte - a.punkte);
    const wunsch = new URLSearchParams(location.search).get("stufe");
    const v = liste.find((x) => x.name === wunsch) || (mobil ? liste[liste.length - 1] : liste[0]);
    const box = $("stufen");
    box.hidden = false;
    for (const x of liste) {
      const b = document.createElement("button");
      b.textContent = `${x.name} ${mio(x.punkte)} Mio.`;
      b.title = `${x.mb} MB laden`;
      b.setAttribute("aria-pressed", String(x === v));
      b.addEventListener("click", () => { if (x !== v) location.search = "?stufe=" + encodeURIComponent(x.name); });
      box.appendChild(b);
    }
    stufeText = ` · ${v.name} (${mobil ? "Handy" : "Desktop"} erkannt)`;
    return v.ordner.replace(/\/?$/, "/");
  }

  async function laden() {
    if (location.protocol === "file:") {
      $("ladeText").textContent = "Bitte über starten.bat öffnen (Browser laden keine Dateien direkt von der Festplatte).";
      return;
    }
    try {
      const basis = await stufeWaehlen();
      const meta = await (await fetch(basis + "meta.json")).json();
      state.meta = meta;
      uni.massstab.value = meta.massstab_m;
      uni.mitteZ.value = meta.mitte[2];
      basisGroesse = Math.max(0.05, 1.4 * (meta.wuerfel_m || 0.65));
      uni.groesse.value = basisGroesse * state.groesse;
      const gesamt = meta.punkte;
      ansicht("schraeg");
      spurAufbauen(meta.fahrt);
      requestAnimationFrame(schleife);
      // mehrere Teile gleichzeitig laden, in Reihenfolge einbauen
      const teile = meta.teile, holen = (t) => fetch(basis + t.datei).then((a) => {
        if (!a.ok) throw new Error(t.datei + ": " + a.status);
        return a.arrayBuffer();
      });
      const vorlauf = [];
      for (let i = 0; i < Math.min(3, teile.length); i++) vorlauf.push(holen(teile[i]));
      for (let i = 0; i < teile.length; i++) {
        const buf = await vorlauf[i];
        if (i + 3 < teile.length) vorlauf.push(holen(teile[i + 3]));
        const t = teilAufbauen(buf, teile[i].versatz);
        teileDaten.push({ i16: t.i16, u8: t.u8, v: teile[i].versatz || [0, 0, 0] });
        geladen += t.n;
        $("ladeText").textContent = `${mio(geladen)} von ${mio(gesamt)} Mio. Punkten`;
        $("ladeBalken").style.width = `${(100 * geladen / gesamt).toFixed(0)}%`;
        if (i === 0) {                                      // Höhenbereich aus dem ersten (gemischten) Teil
          const z = [];
          const vz = (teile[i].versatz || [0, 0, 0])[2];
          for (let j = 2; j < t.i16.length; j += 5 * 7) z.push(t.i16[j] * meta.massstab_m + vz + meta.mitte[2]);
          z.sort((a, b) => a - b);
          state.zLo = z[Math.floor(z.length * 0.01)]; state.zHi = z[Math.floor(z.length * 0.995)];
          uni.zLo.value = state.zLo; uni.zHi.value = state.zHi;
          ansicht("schraeg");
        }
      }
      $("laden").hidden = true;
    } catch (err) {
      $("ladeText").textContent = "Die Punktdaten ließen sich nicht laden. Seite neu öffnen.";
      console.error(err);
    }
  }
  laden();
})();
</script>
